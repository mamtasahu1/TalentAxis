server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow CV resume uploads up to 10MB
    client_max_body_size 10M;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Static Build (React SPA)
    location / {
        root /var/www/talentaxis/frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend REST API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer requests (e.g., CV file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve uploaded CV documents
    location /uploads/ {
        alias /var/www/talentaxis/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
